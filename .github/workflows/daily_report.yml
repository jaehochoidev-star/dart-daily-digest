name: DART 장 마감 리포트

on:
  schedule:
    - cron: '0 10 * * *' # 19:00 Asia/Seoul, every calendar day
  workflow_dispatch:
    inputs:
      date:
        description: '공시 기준일 (YYYY-MM-DD, 비우면 한국시간 오늘)'
        required: false
        type: string
      rebuild_only:
        description: '수집 없이 저장된 이력으로 웹페이지만 재배포'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dart-daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집·보관 검증
        run: python -m unittest discover -s tests -v
      - name: 당일 공시 수집
        if: ${{ inputs.rebuild_only != true }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REPORT_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python digest.py --date "$REPORT_DATE"
          else
            python digest.py
          fi
      - name: 정적 웹페이지 생성
        run: python build_site.py
      - name: 날짜별 기록 영구 보관
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p reports
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive daily disclosure report [skip ci]'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: 재실행별 배포 이름
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
